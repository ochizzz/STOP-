<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1B1F3B">
<title>СТОП! Симулятор тупейшего патрульного</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ===== КАРТА ===== -->
  <section class="screen active" id="scrMap">
    <div id="mapScroll"><svg id="city" viewBox="0 0 400 1000" preserveAspectRatio="xMidYMin meet"></svg></div>
    <header class="topbar">
      <div class="profile">
        <div class="speed" id="lvl">1</div>
        <div class="plate"><b id="plateName">ЖЕЗЛ 01</b><small id="rankName">Стажёр</small><i class="xp"><u id="xpBar"></u></i></div>
      </div>
      <div class="coins"><span class="coin">₽</span><b class="cAmount">0</b></div>
    </header>
    <div class="side left">
      <button class="sbtn" id="btnBonus"><span class="ic">🎁</span><span class="lb">Бонус</span><i class="badge"></i></button>
      <button class="sbtn" id="btnDaily"><span class="ic">📋</span><span class="lb">Задания</span><i class="badge"></i></button>
    </div>
    <div class="side right">
      <button class="sbtn" id="btnShift"><span class="ic">🚓</span><span class="lb">Смена</span></button>
      <button class="sbtn" id="btnRadio"><span class="ic">📻</span><span class="lb">Рация</span></button>
    </div>
  </section>

  <!-- ===== МАГАЗИН ===== -->
  <section class="screen page" id="scrShop">
    <header class="phead"><h2 class="chunk">МАГАЗИН</h2><div class="coins"><span class="coin">₽</span><b class="cAmount">0</b></div></header>
    <div class="pbody">
      <h3 class="sec">Бустеры <small>берутся на смену автоматически</small></h3>
      <div class="grid2" id="shopBoost"></div>
      <h3 class="sec">Улучшения</h3>
      <div class="list" id="shopUp"></div>
      <h3 class="sec">Конфискат</h3>
      <div id="shopChest"></div>
    </div>
  </section>

  <!-- ===== ГАРДЕРОБ ===== -->
  <section class="screen page" id="scrWardrobe">
    <header class="phead"><h2 class="chunk">ГАРДЕРОБ</h2><div class="coins"><span class="coin">₽</span><b class="cAmount">0</b></div></header>
    <div class="pbody">
      <div class="podium"><div id="copPreview"></div><div class="plate big"><b id="plateName2">ЖЕЗЛ 01</b></div></div>
      <div class="seg" id="wTabs">
        <button data-cat="hat" class="on">Шапка</button><button data-cat="uniform">Форма</button><button data-cat="baton">Жезл</button>
      </div>
      <div class="grid3" id="wItems"></div>
    </div>
  </section>

  <!-- ===== НАСТРОЙКИ ===== -->
  <section class="screen page" id="scrSettings">
    <header class="phead"><h2 class="chunk">НАСТРОЙКИ</h2></header>
    <div class="pbody">
      <div class="card rows">
        <label class="row"><span>🔊 Звук</span><input type="checkbox" class="sw" data-set="sound"></label>
        <label class="row"><span>📳 Вибрация</span><input type="checkbox" class="sw" data-set="vibro"></label>
        <label class="row"><span>✨ Эффекты <small>тряска, частицы</small></span><input type="checkbox" class="sw" data-set="effects"></label>
        <label class="row"><span>👆 Подсказки</span><input type="checkbox" class="sw" data-set="hints"></label>
      </div>
      <div class="card rows">
        <div class="row"><span>🚘 Номер патруля</span><input id="nameInput" maxlength="10" autocomplete="off"></div>
        <div class="row"><span>🌐 Язык</span><b>Русский</b></div>
      </div>
      <div class="card rows">
        <div class="row"><span>🧾 Версия</span><b>2.0 «Жезл»</b></div>
        <button class="row danger" id="btnReset"><span class="octa sm">СТОП</span><span>Сбросить прогресс</span></button>
      </div>
    </div>
  </section>

  <!-- ===== РЕЙТИНГ ===== -->
  <section class="screen page" id="scrRating">
    <header class="phead"><h2 class="chunk">РЕЙТИНГ</h2></header>
    <div class="pbody">
      <div class="grid2" id="statCards"></div>
      <h3 class="sec">Доска почёта <small>лучшая свободная смена</small></h3>
      <div class="list" id="board"></div>
    </div>
  </section>

  <!-- ===== НИЖНЯЯ НАВИГАЦИЯ ===== -->
  <nav id="nav">
    <button data-scr="scrShop"><span class="ic">🛒</span><span>Магазин</span></button>
    <button data-scr="scrWardrobe"><span class="ic">👕</span><span>Гардероб</span></button>
    <button data-scr="scrMap" class="mapBtn on"><span class="ring"><span class="ic">🗺️</span></span><span>Карта</span><i class="wcount" id="mCount"></i></button>
    <button data-scr="scrSettings"><span class="ic">⚙️</span><span>Настройки</span></button>
    <button data-scr="scrRating"><span class="ic">🏆</span><span>Рейтинг</span></button>
  </nav>

  <!-- ===== ИГРА ===== -->
  <section id="scrGame">
    <div id="gStage"><canvas id="gCanvas"></canvas>
      <div class="ghud">
        <div class="hearts" id="gHearts"></div>
        <div class="gscore chunk" id="gScore">0</div>
        <button class="octa" id="gPause" aria-label="пауза">СТОП</button>
      </div>
      <div class="goal" id="gGoal"><b></b><span class="bar"><i></i></span></div>
    </div>
    <div class="gpowers">
      <button class="pw" id="pwZen"><span class="em">🪄</span><span class="lb">Дзен</span><i class="cd"></i></button>
      <button class="pw" id="pwEvac"><span class="em">🏗️</span><span class="lb">Эвакуатор</span><b class="n">0</b></button>
      <button class="pw" id="pwSiren"><span class="em">🚨</span><span class="lb">Сирена</span><b class="n">0</b></button>
      <button class="pw" id="pwDonut"><span class="em">🍩</span><span class="lb">Пончик</span><b class="n">0</b></button>
    </div>
  </section>

  <!-- ===== ОКНА ===== -->
  <div class="veil" id="veil"></div>
  <div class="sheet" id="sheet"></div>
  <div class="modal" id="modal"></div>
  <div class="toast" id="toast"></div>
</div>

<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
</body>
</html>
